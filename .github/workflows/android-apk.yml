name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK (Flutter + Rust/OpenHuman)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Generate Android project scaffolding
        run: flutter create . --platforms=android --project-name arc_wallet_flutter

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build OpenHuman Rust bridge for Android
        run: ./scripts/build_android_rust.sh

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        env:
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
        run: |
          if [ -n "$WALLETCONNECT_PROJECT_ID" ]; then
            flutter build apk --release --dart-define=WALLETCONNECT_PROJECT_ID="$WALLETCONNECT_PROJECT_ID"
          else
            flutter build apk --release
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arc-wallet-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
