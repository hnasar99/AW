name: Android APK and verification

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Verify and build embedded OpenHuman Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      NDK_VERSION: '28.2.13676358'
    steps:
      - name: Checkout source and pinned native dependencies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Set up Rust and native build dependencies
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
          rustup target add aarch64-linux-android --toolchain 1.96.1
          cargo install cargo-ndk --version 4.1.2 --locked
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config clang libclang-dev cmake

      - name: Set up pinned Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902' # 22.0, matching the verified local toolchain
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install explicit Android packages
        run: |
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'cmake;3.22.1' "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Verify upstream source and apply reviewed patches
        run: bash scripts/prepare_upstream.sh

      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test Dart
        run: |
          flutter analyze
          flutter test
          flutter test --dart-define=AW_LAB_TEXT_ONLY=true

      - name: Verify APK, source and lab preflight gates
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/lab -p 'test_*.py' -v

      - name: Verify Rust bridge
        run: |
          cargo fmt -p arc_openhuman_bridge -- --check
          cargo test --locked -p arc_openhuman_bridge --lib

      - name: Verify native text-only lab against local HTTP fixtures
        run: |
          mkdir -p artifacts
          cargo build --locked -p arc_openhuman_bridge
          python3 scripts/lab/smoke_native_lab.py --library target/debug/libarc_openhuman_bridge.so --include-timeout --report artifacts/lab-native-smoke.json
          cargo tree --locked -p arc_openhuman_bridge --target aarch64-linux-android -e features -i reqwest > artifacts/android-reqwest-features.txt

      - name: Release temporary host test cache
        run: cargo clean --profile dev

      - name: Build embedded Rust for Android
        run: bash scripts/build_android_rust.sh arm64-v8a

      - name: Build QA APK
        run: flutter build apk --release --flavor qa --target-platform android-arm64

      - name: Inspect actual APK and its signing certificate
        run: |
          mkdir -p artifacts
          python3 scripts/inspect_apk.py build/app/outputs/flutter-apk/app-qa-release.apk --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --pubspec pubspec.yaml --flavor qa --output artifacts/apk-inspection.json
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-qa-release.apk > artifacts/apk-signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-qa-release.apk > artifacts/apk-alignment.txt
          sha256sum build/app/outputs/flutter-apk/app-qa-release.apk > artifacts/SHA256SUMS.txt
          cp build/app/outputs/flutter-apk/app-qa-release.apk artifacts/aw-qa-arm64.apk

      - name: Build and inspect the text-only lab configuration of AW
        run: |
          flutter build apk --release --flavor qa --target-platform android-arm64 --dart-define=AW_LAB_TEXT_ONLY=true
          cp build/app/outputs/flutter-apk/app-qa-release.apk artifacts/aw-lab-arm64.apk
          python3 scripts/inspect_apk.py artifacts/aw-lab-arm64.apk --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --pubspec pubspec.yaml --flavor qa --output artifacts/lab-apk-inspection.json
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/aw-lab-arm64.apk > artifacts/lab-apk-signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 artifacts/aw-lab-arm64.apk > artifacts/lab-apk-alignment.txt
          sha256sum artifacts/aw-qa-arm64.apk artifacts/aw-lab-arm64.apk > artifacts/SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('artifacts/build-modes.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'aw-qa-arm64.apk': {'AW_LAB_TEXT_ONLY': False},
              'aw-lab-arm64.apk': {'AW_LAB_TEXT_ONLY': True, 'context_budget_tokens': 4096},
              'android_ui_to_real_model_verified': False,
              'note': 'Build and synthetic tests only. Both APKs use the existing QA package; lab acceptance requires the operator device and local model.'
          }, indent=2) + '\n')
          PY

      - name: Upload APK and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aw-android-qa-${{ github.sha }}
          path: |
            artifacts/
            Cargo.lock
            pubspec.lock
          if-no-files-found: error
          retention-days: 30
