name: arc_wallet_flutter
description: Fluuix EVM network profiles, Arc Testnet wallet and embedded OpenHuman Rust runtime.
publish_to: "none"
version: 0.4.0+4
environment:
  sdk: ">=3.8.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^14.0.0
  http: ^1.6.0
  reown_sign: 1.4.1
  reown_core: 1.5.1
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  ffi: ^2.1.3
  flutter_secure_storage: 10.3.4
  mobile_scanner: ^7.0.0
  path_provider: ^2.1.4
  phosphor_flutter: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/fluuix_logo.png
